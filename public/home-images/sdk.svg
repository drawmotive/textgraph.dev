  <title id="title">SDKs inside your application</title>
  <desc id="desc">A TextGraph renderer returns PNG or SVG. A separate DrawMotive Editor provides a canvas and editable documents. Browser, Worker and Node.js support rendering; React uses PNG.</desc>
