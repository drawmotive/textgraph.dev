name: Static site contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: textgraph-site-${{ matrix.os }}-node-${{ matrix.node }}
          path: .vitepress/dist/
          include-hidden-files: true
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: textgraph-site-browser-failures
          path: test-results/
